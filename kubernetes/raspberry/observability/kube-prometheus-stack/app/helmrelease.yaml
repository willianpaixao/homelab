---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app kube-prometheus-stack
  namespace: &namespace observability
spec:
  interval: 1h
  timeout: 30m
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
    namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      strategy: rollback
      retries: 3
  values:
    crds:
      upgradeJob:
        enabled: true
        forceConflicts: true
    alertmanager:
      ingress:
        enabled: false
      alertmanagerSpec:
        replicas: 1
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: In
                      values:
                        - logos
        alertmanagerConfiguration:
          name: alertmanager-config
    prometheus:
      service:
        type: LoadBalancer
        loadBalancerIP: 192.168.0.35
      ingress:
        enabled: false
      serviceMonitor:
        relabelings:
          - replacement: raspberry
            targetLabel: cluster
      prometheusSpec:
        replicas: 1
        scrapeInterval: 30s
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: prometheus
        ruleSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        enableAdminAPI: true
        walCompression: true
        enableFeatures:
          - auto-gomaxprocs
          - memory-snapshot-on-shutdown
          - new-service-discovery-manager
          - out-of-order-time-series
        enableRemoteWriteReceiver: true
        tsdb:
          outOfOrderTimeWindow: 5m
        retention: 30d
        retentionSize: 128GiB
        resources:
          requests:
            cpu: 500m
            memory: 3Gi
          limits:
            memory: 6Gi
        nodeSelector:
          disktype: ssd
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              resources:
                requests:
                  storage: 128Gi
    kubeApiServer:
      serviceMonitor:
        metricRelabelings:
          - sourceLabels: [__name__]
            action: drop
            regex: 'apiserver_(request_duration_seconds|response_sizes|request_body_size_bytes|watch_events_sizes|watch_events_dispatch_duration_seconds|watch_list_duration_seconds|storage_list_duration_seconds|watch_cache_read_wait_seconds|watch_cache_initialization_duration_seconds)_bucket'
          - sourceLabels: [__name__]
            action: drop
            regex: '(etcd_request_duration_seconds|workqueue_queue_duration_seconds|workqueue_work_duration_seconds|rest_client_request_duration_seconds)_bucket'
        relabelings:
          - replacement: raspberry
            targetLabel: cluster
    kubelet:
      serviceMonitor:
        metricRelabelings:
          - sourceLabels: [__name__]
            action: drop
            regex: 'apiserver_(request_duration_seconds|response_sizes|request_body_size_bytes|watch_events_sizes|watch_events_dispatch_duration_seconds|watch_list_duration_seconds|storage_list_duration_seconds|watch_cache_read_wait_seconds|watch_cache_initialization_duration_seconds)_bucket'
          - sourceLabels: [__name__]
            action: drop
            regex: '(etcd_request_duration_seconds|workqueue_queue_duration_seconds|workqueue_work_duration_seconds|rest_client_request_duration_seconds)_bucket'
          - sourceLabels: [__name__, le]
            action: drop
            regex: '(csi_operations|storage_operation_duration)_seconds_bucket;(0.25|2.5|15|25|120|600)(\.0)?'
        cAdvisorRelabelings:
          - sourceLabels: [__metrics_path__]
            targetLabel: metrics_path
          - replacement: raspberry
            targetLabel: cluster
        cAdvisorMetricRelabelings:
          # Drop expensive cAdvisor histogram buckets
          - sourceLabels: [__name__]
            action: drop
            regex: 'container_.*_bucket'
          # Keep only useful cAdvisor metrics
          - sourceLabels: [__name__]
            regex: 'container_cpu_cfs_throttled_periods_total|container_cpu_cfs_periods_total|container_(network|memory|fs|cpu|spec).*'
            action: keep
        relabelings:
          - sourceLabels: [__metrics_path__]
            targetLabel: metrics_path
          - replacement: raspberry
            targetLabel: cluster
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    kube-state-metrics:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - logos
      prometheus:
        monitor:
          relabelings:
            - replacement: raspberry
              targetLabel: cluster
    prometheus-node-exporter:
      prometheus:
        monitor:
          relabelings:
            - replacement: raspberry
              targetLabel: cluster
    prometheusOperator:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - logos
      serviceMonitor:
        relabelings:
          - replacement: raspberry
            targetLabel: cluster
    grafana:
      enabled: true
      defaultDashboardsTimezone: ${TIMEZONE}
      deploymentStrategy:
        type: Recreate
      extraConfigmapMounts:
        - name: grafana-custom-ini
          mountPath: /etc/grafana/custom.ini
          subPath: custom.ini
          configMap: grafana-custom-ini
          readOnly: true
      ingress:
        enabled: false
      sidecar:
        dashboards:
          multicluster:
            global:
              enabled: true
          provider:
            foldersFromFilesStructure: true
          searchNamespace: observability
          folderAnnotation: grafana_folder
      persistence:
        enabled: true
        storageClassName: longhorn-single
        accessModes:
          - ReadWriteOnce
        size: 8Gi
      datasources:
        datasources.yaml:
          apiVersion: 1
          datasources:
            - name: Prometheus
              type: prometheus
              uid: prometheus
              url: http://kube-prometheus-stack-prometheus.observability:9090
              access: proxy
              jsonData:
                timeInterval: 30s
            - name: Alertmanager
              type: alertmanager
              uid: alertmanager
              url: http://kube-prometheus-stack-alertmanager.observability.svc.cluster.local:9093
              access: proxy
              jsonData:
                implementation: prometheus
      nodeSelector:
        disktype: ssd
