---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app bookorbit
  namespace: &namespace media
spec:
  interval: 1h
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  maxHistory: 2
  test:
    enable: false
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      bookorbit:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          enableServiceLinks: false
          securityContext:
            fsGroup: 2000
            fsGroupChangePolicy: "OnRootMismatch"
        initContainers:
          wait-postgres:
            image: &pgImage
              repository: pgvector/pgvector
              tag: pg18@sha256:c29f30688a9ad961691bdf0ec1650717cc132a5814619d80f80463d6e4c42e47
            command:
              - /bin/sh
              - -c
              - |
                until pg_isready -h bookorbit-postgres -U bookorbit -d bookorbit; do
                  echo "Waiting for PostgreSQL to be ready..."
                  sleep 2
                done
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
        containers:
          app:
            image:
              repository: ghcr.io/bookorbit/bookorbit
              tag: 3.6.0@sha256:bbb5da52e96dbbff1dd36f55454f9845e6cde264b4b3428a3ea783124a4ca62e
            env:
              TZ: ${TIMEZONE}
              NODE_ENV: production
              PORT: "3000"
              PUID: "2000"
              PGID: "2000"
              APP_URL: "https://bookorbit.${SECRET_DOMAIN}"
              POSTGRES_HOST: bookorbit-postgres
              POSTGRES_PORT: "5432"
              POSTGRES_USER: bookorbit
              POSTGRES_DB: bookorbit
              NODE_MAX_OLD_SPACE_SIZE: "2048"
              LIBRARY_BROWSE_ROOT: /books
              BOOK_DOCK_PATH: /books/bookdrop
            envFrom:
              - secretRef:
                  name: bookorbit-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 3000
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: true
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
          safaribooks-bridge:
            image:
              repository: ghcr.io/willianpaixao/safaribooks-bridge
              tag: sha-2398ccb@sha256:c8eb9874db67cfe88045f6a269d6dcfb738d2144cbf54bd03157ea2d44d88f7a
            envFrom:
              - secretRef:
                  name: safaribooks-bridge
            env:
              BRIDGE_DATA_DIR: /data/safaribooks
              BRIDGE_OREILLY_COOKIES_FILE: /run/secrets/oreilly/cookies.json
              BRIDGE_CAP_TZ: Europe/Stockholm
            ports:
              - name: ops
                containerPort: 9787
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /livez
                    port: ops
                  periodSeconds: 30
                  timeoutSeconds: 2
                  failureThreshold: 3
              # No readiness probe: an unready sidecar would take BookOrbit out of its Service.
              readiness:
                enabled: false
              startup:
                enabled: false
            securityContext:
              runAsUser: 2000
              runAsGroup: 2000
              runAsNonRoot: true
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              seccompProfile:
                type: RuntimeDefault
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
      postgres:
        strategy: Recreate
        containers:
          app:
            image: *pgImage
            env:
              POSTGRES_USER: bookorbit
              POSTGRES_DB: bookorbit
              POSTGRES_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: bookorbit-secret
                    key: POSTGRES_PASSWORD
              PGDATA: /var/lib/postgresql/data/pgdata
              POSTGRES_INITDB_ARGS: "--data-checksums"
            probes:
              liveness: &pgProbes
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /bin/sh
                      - -c
                      - pg_isready -U bookorbit -d bookorbit
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *pgProbes
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /bin/sh
                      - -c
                      - pg_isready -U bookorbit -d bookorbit
                  failureThreshold: 30
                  periodSeconds: 10
                  successThreshold: 1
                  timeoutSeconds: 5
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
      postgres:
        controller: postgres
        ports:
          postgres:
            port: 5432
    ingress:
      app:
        className: cilium
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Media
          gethomepage.dev/icon: mdi-book-open-page-variant
          gethomepage.dev/name: BookOrbit
        hosts:
          - host: &host bookorbit.${SECRET_DOMAIN}
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
              - *host
    persistence:
      data:
        enabled: true
        type: persistentVolumeClaim
        storageClass: longhorn
        accessMode: ReadWriteOnce
        size: 2Gi
        advancedMounts:
          bookorbit:
            app:
              - path: /data
            safaribooks-bridge:
              - path: /data
      books:
        enabled: true
        type: nfs
        server: ${NFS_SERVER}
        path: /books
        advancedMounts:
          bookorbit:
            app:
              - path: /books
      tmp:
        enabled: true
        type: emptyDir
        advancedMounts:
          bookorbit:
            app:
              - path: /tmp
      bridge-tmp:
        enabled: true
        type: emptyDir
        medium: Memory
        sizeLimit: 64Mi
        advancedMounts:
          bookorbit:
            safaribooks-bridge:
              - path: /tmp
      oreilly-cookies:
        enabled: true
        type: secret
        name: safaribooks-bridge-cookies
        defaultMode: 0440
        advancedMounts:
          bookorbit:
            safaribooks-bridge:
              - path: /run/secrets/oreilly
                readOnly: true
      db:
        enabled: true
        type: persistentVolumeClaim
        storageClass: longhorn
        accessMode: ReadWriteOnce
        size: 5Gi
        advancedMounts:
          postgres:
            app:
              - path: /var/lib/postgresql/data
    defaultPodOptions:
      labels:
        app: bookorbit
        environment: production
        owner: willianpaixao
      dnsConfig:
        options:
          - name: ndots
            value: "1"
