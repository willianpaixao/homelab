---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app bookorbit
  namespace: &namespace media
spec:
  interval: 1h
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  maxHistory: 2
  test:
    enable: false
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      bookorbit:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          enableServiceLinks: false
          securityContext:
            fsGroup: 2000
            fsGroupChangePolicy: "OnRootMismatch"
        initContainers:
          wait-postgres:
            image: &pgImage
              repository: pgvector/pgvector
              tag: pg18@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
            command:
              - /bin/sh
              - -c
              - |
                until pg_isready -h bookorbit-postgres -U bookorbit -d bookorbit; do
                  echo "Waiting for PostgreSQL to be ready..."
                  sleep 2
                done
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
        containers:
          app:
            image:
              repository: ghcr.io/bookorbit/bookorbit
              tag: 3.1.0@sha256:78b6eac18306eb7eba0dbf6592ecdee01b15f24de9a941cb853db4a0232d7999
            env:
              TZ: ${TIMEZONE}
              NODE_ENV: production
              PORT: "3000"
              PUID: "2000"
              PGID: "2000"
              APP_URL: "https://bookorbit.${SECRET_DOMAIN}"
              POSTGRES_HOST: bookorbit-postgres
              POSTGRES_PORT: "5432"
              POSTGRES_USER: bookorbit
              POSTGRES_DB: bookorbit
              NODE_MAX_OLD_SPACE_SIZE: "2048"
              LIBRARY_BROWSE_ROOT: /books
              BOOK_DOCK_PATH: /books/bookdrop
            envFrom:
              - secretRef:
                  name: bookorbit-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 3000
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: true
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
      postgres:
        strategy: Recreate
        containers:
          app:
            image: *pgImage
            env:
              POSTGRES_USER: bookorbit
              POSTGRES_DB: bookorbit
              POSTGRES_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: bookorbit-secret
                    key: POSTGRES_PASSWORD
              PGDATA: /var/lib/postgresql/data/pgdata
              POSTGRES_INITDB_ARGS: "--data-checksums"
            probes:
              liveness: &pgProbes
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /bin/sh
                      - -c
                      - pg_isready -U bookorbit -d bookorbit
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *pgProbes
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /bin/sh
                      - -c
                      - pg_isready -U bookorbit -d bookorbit
                  failureThreshold: 30
                  periodSeconds: 10
                  successThreshold: 1
                  timeoutSeconds: 5
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
      postgres:
        controller: postgres
        ports:
          postgres:
            port: 5432
    ingress:
      app:
        className: cilium
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Media
          gethomepage.dev/icon: mdi-book-open-page-variant
          gethomepage.dev/name: BookOrbit
        hosts:
          - host: &host bookorbit.${SECRET_DOMAIN}
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
              - *host
    persistence:
      data:
        enabled: true
        type: persistentVolumeClaim
        storageClass: longhorn
        accessMode: ReadWriteOnce
        size: 2Gi
        advancedMounts:
          bookorbit:
            app:
              - path: /data
      books:
        enabled: true
        type: nfs
        server: ${NFS_SERVER}
        path: /books
        advancedMounts:
          bookorbit:
            app:
              - path: /books
      tmp:
        enabled: true
        type: emptyDir
        advancedMounts:
          bookorbit:
            app:
              - path: /tmp
      db:
        enabled: true
        type: persistentVolumeClaim
        storageClass: longhorn
        accessMode: ReadWriteOnce
        size: 5Gi
        advancedMounts:
          postgres:
            app:
              - path: /var/lib/postgresql/data
    defaultPodOptions:
      labels:
        app: bookorbit
        environment: production
        owner: willianpaixao
