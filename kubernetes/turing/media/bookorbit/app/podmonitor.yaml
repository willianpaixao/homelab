---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/monitoring.coreos.com/podmonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: safaribooks-bridge
  namespace: media
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: bookorbit
  podMetricsEndpoints:
    - port: ops
      path: /metrics
      interval: 60s
